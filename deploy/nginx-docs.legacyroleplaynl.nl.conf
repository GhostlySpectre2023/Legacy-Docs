# Nginx site for docs.legacyroleplaynl.nl (static files, no Node needed)
# 1. Copy the docs folder to /var/www/legacy-docs
# 2. Put this file in /etc/nginx/sites-available/ and symlink it into sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. HTTPS: sudo certbot --nginx -d docs.legacyroleplaynl.nl
server {
    listen 80;
    listen [::]:80;
    server_name docs.legacyroleplaynl.nl;

    root /var/www/legacy-docs;
    index index.html;

    # Never serve dev/deploy files
    location ~ /(\.|deploy/|serve\.js|README\.md) { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(woff2|png|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.md$ {
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-cache";
    }

    location ~* \.(json|js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}
