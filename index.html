<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legacy Docs</title>
  <meta name="description" content="Installation guides, configuration, exports and FAQs for all Legacy Scripts FiveM resources.">
  <meta name="theme-color" content="#0b0a0f">
  <meta property="og:title" content="Legacy Docs">
  <meta property="og:description" content="Installation guides, configuration, exports and FAQs for all Legacy Scripts resources.">
  <meta property="og:image" content="https://docs.legacyroleplaynl.nl/assets/img/server_icoon_512.png">
  <link rel="icon" type="image/png" href="assets/img/server_icoon_512.png">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    try { var t = localStorage.getItem('ld-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a href="#/" class="brand">
        <img src="assets/img/server_icoon_512.png" alt="" width="34" height="34">
        <span>Legacy<b>Docs</b></span>
      </a>
      <button class="search-trigger" id="searchBtn">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search docs…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <nav class="top-links">
        <a href="https://legacyroleplaynl.nl" target="_blank" rel="noopener">Website</a>
        <a href="#/general/support">Support</a>
        <a class="btn-primary" href="https://legacyroleplaynl.nl/winkel.html" target="_blank" rel="noopener">Store
          <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></a>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Documentation navigation"></aside>
    <div class="scrim" id="scrim"></div>
    <main class="main" id="main" tabindex="-1">
      <div class="loading">Loading…</div>
    </main>
    <aside class="toc" id="toc" aria-label="On this page"></aside>
  </div>

  <div class="search-modal" id="searchModal" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search">
      <div class="search-input">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search installation, config, exports…" autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <ul class="search-results" id="searchResults"></ul>
    </div>
  </div>

  <script src="assets/markdown.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
